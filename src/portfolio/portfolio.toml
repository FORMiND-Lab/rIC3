# If you modify this file, you need to recompile.

[bl_default]
ic3 = "ic3"
ic3_no_preproc = "ic3 --ctg=false --frts=false --scorr=false --drop-po=false"
ic3_no_parent = "ic3 --drop-po=false --parent-lemma=false"
ic3_abs_cst = "ic3 --abs-cst"
ic3_abs_all = "ic3 --abs-cst --abs-trans"
ic3_predprop = "ic3 --pred-prop"
ic3_ctg_limit = "ic3 --ctg-max 5 --ctg-limit 15 --drop-po=false"
ic3_inn = "ic3 --inn"
ic3_inn_ctp = "ic3 --inn --ctp"
ic3_inn_noctg = "ic3 --inn --ctg=false"
ic3_inn_dynamic = "ic3 --inn --dynamic --drop-po=false"
bmc = "bmc --step 1"
bmc_kissat_10 = "bmc --kissat --step 10"
bmc_kissat_65 = "bmc --kissat --step 65"
bmc_kissat_dyn = "bmc --kissat --dyn-step"
kind = "kind --step 1 --simple-path"

[wl_default]
ic3 = "ic3"
ic3_no_preproc = "ic3 --ctg=false --frts=false --scorr=false --drop-po=false"
ic3_no_parent = "ic3 --drop-po=false --parent-lemma=false"
ic3_abs_cst = "ic3 --abs-cst"
ic3_abs_all = "ic3 --abs-cst --abs-trans"
ic3_predprop = "ic3 --pred-prop"
ic3_ctg_limit = "ic3 --ctg-max 5 --ctg-limit 15 --drop-po=false"
ic3_inn = "ic3 --inn"
ic3_inn_ctp = "ic3 --inn --ctp"
ic3_inn_noctg = "ic3 --inn --ctg=false"
ic3_inn_dynamic = "ic3 --inn --dynamic --drop-po=false"
bmc = "bmc --step 1"
bmc_kissat_10 = "bmc --kissat --step 10"
bmc_kissat_dyn = "bmc --kissat --dyn-step"
wlbmc = "wl-bmc"
wlkind = "wl-kind --step 1"

[light]
ic3_no_preproc = "ic3 --ctg=false --frts=false --scorr=false --drop-po=false"
ic3_abs_all = "ic3 --abs-cst --abs-trans"
ic3_predprop = "ic3 --pred-prop"
ic3_inn = "ic3 --inn"
ic3_inn_ctp = "ic3 --inn --ctp"
ic3_inn_noctg = "ic3 --inn --ctg=false"
bmc = "bmc --step 1"
bmc_kissat_10 = "bmc --kissat --step 10"

# A narrow CPU/FPGA A/B. These are the same two workers selected by the
# automatic FPGA allowlist, without the fourteen CPU/BMC workers that usually
# finish first and reduce accelerator activity to a few startup inquiries.
[fpga_pair]
ic3 = "ic3"
ic3_ctg_limit = "ic3 --ctg-max 5 --ctg-limit 15 --drop-po=false"

# Four independent IC3 contexts for the simulation-first short-query supply
# gate. They share preprocessing and the immutable transition relation, while
# proof queues, frame clauses, trails and learnt state remain lane-private.
# Production selection stays on fpga_pair until this quad passes native and
# board-calibrated economics gates.
[fpga_quad]
ic3 = "ic3"
ic3_ctg_limit = "ic3 --ctg-max 5 --ctg-limit 15 --drop-po=false"
ic3_no_parent = "ic3 --drop-po=false --parent-lemma=false"
ic3_predprop = "ic3 --pred-prop"

# Eight producers feeding a four-lane resident accelerator.  This exists only
# for the simulation-first supply/queueing gate: an FPGA build is forbidden
# until time-aligned traces show that the extra contexts can keep four lanes
# occupied without a latency-dominating coalescing window.
[fpga_octet]
ic3 = "ic3"
ic3_ctg_limit = "ic3 --ctg-max 5 --ctg-limit 15 --drop-po=false"
ic3_no_parent = "ic3 --drop-po=false --parent-lemma=false"
ic3_predprop = "ic3 --pred-prop"
ic3_abs_cst = "ic3 --abs-cst"
ic3_abs_all = "ic3 --abs-cst --abs-trans"
ic3_inn = "ic3 --inn"
ic3_inn_ctp = "ic3 --inn --ctp"

[bl_hwmcc]
ic3 = "ic3"
ic3_no_preproc = "ic3 --ctg=false --frts=false --scorr=false --drop-po=false"
ic3_no_parent = "ic3 --drop-po=false --parent-lemma=false"
ic3_abs_cst = "ic3 --abs-cst"
ic3_abs_all = "ic3 --abs-cst --abs-trans"
ic3_dynamic = "ic3 --abs-cst --abs-trans --dynamic --drop-po=false"
ic3_ctg_limit = "ic3 --ctg-max 5 --ctg-limit 15 --drop-po=false"
ic3_inn = "ic3 --inn"
ic3_inn_ctp = "ic3 --inn --ctp"
ic3_inn_noctg = "ic3 --inn --ctg=false"
ic3_inn_dynamic = "ic3 --inn --dynamic --drop-po=false"
bmc = "bmc --step 1"
bmc_kissat_10 = "bmc --kissat --step 10"
bmc_kissat_65 = "bmc --kissat --step 65"
bmc_kissat_dyn = "bmc --kissat --dyn-step"
kind = "kind --step 1"
